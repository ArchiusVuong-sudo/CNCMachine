    <line x1="16" y1="16" x2="16"    y2="5"    />
    <line x1="16" y1="16" x2="26.46" y2="12.60"/>
    <line x1="16" y1="16" x2="22.47" y2="24.90"/>
    <line x1="16" y1="16" x2="9.53"  y2="24.90"/>
    <line x1="16" y1="16" x2="5.54"  y2="12.60"/>
  </g>
  <g fill="#215F9A">
    <circle cx="16"    cy="5"     r="2.9"/>
    <circle cx="26.46" cy="12.60" r="2.9"/>
    <circle cx="22.47" cy="24.90" r="2.9"/>
    <circle cx="9.53"  cy="24.90" r="2.9"/>
    <circle cx="5.54"  cy="12.60" r="2.9"/>
